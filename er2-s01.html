<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reflex 2 Finished Past</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --paper:#ffffff; --surface:#fbf8f5; --surface-2:#f4efe9;
    --line:#e8e0d8; --line-strong:#d6cabd;
    --ink:#1a1a19; --ink-2:#56514b; --ink-3:#847c73;
    --navy:#001b45; --salmon:#d97757; --salmon-ink:#c3512b; --salmon-soft:#fdeee7;
    --good:#006838; --good-soft:#e9f3ec; --bad:#a32b1c; --bad-soft:#fbeceb;
    --display:"Playfair Display",Georgia,serif;
    --body:"Be Vietnam Pro","Segoe UI",system-ui,-apple-system,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
  h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance}
  p{margin:0}
  button{font-family:inherit;font-size:inherit;color:inherit}
  input,textarea{font-family:inherit;font-size:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--salmon);outline-offset:2px}

  .app{display:flex;flex-direction:column;height:100%;min-height:520px;background:var(--paper)}

  /* ---------- top bar ---------- */
  .bar{flex:none;border-bottom:1px solid var(--line);padding:12px 20px 0;background:var(--paper)}
  .bar-top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3)}
  .eyebrow b{color:var(--salmon-ink);font-weight:600}
  .bar-title{font-family:var(--display);font-size:16px;color:var(--navy);font-weight:600}
  .bar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
  .mini{font-family:var(--mono);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;padding:2px;background:var(--surface);gap:2px}
  .seg button{border:0;background:transparent;padding:4px 10px;border-radius:999px;cursor:pointer;font-size:12px;color:var(--ink-2)}
  .seg button[aria-pressed="true"]{background:var(--salmon);color:#fff;font-weight:600}
  .ghost{border:1px solid var(--line-strong);background:var(--paper);border-radius:999px;padding:4px 11px;font-size:12px;cursor:pointer;color:var(--ink-2)}
  .ghost:hover{border-color:var(--salmon);color:var(--salmon-ink)}

  .steps{display:flex;gap:6px;overflow-x:auto;padding:10px 0 0;margin:0 -2px;scrollbar-width:none}
  .steps::-webkit-scrollbar{display:none}
  .steps button{
    flex:none;border:1px solid var(--line);background:var(--paper);border-radius:999px 999px 0 0;
    border-bottom:0;padding:6px 12px 7px;font-size:12.5px;color:var(--ink-2);cursor:pointer;white-space:nowrap;
    display:flex;align-items:center;gap:7px;
  }
  .steps button .n{font-family:var(--mono);font-size:10px;color:var(--ink-3)}
  .steps button .c{font-family:var(--mono);font-size:10px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .steps button.done{border-color:var(--good)}
  .steps button.done .c{color:var(--good)}
  .steps button[aria-current="true"]{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
  .steps button[aria-current="true"] .n,.steps button[aria-current="true"] .c{color:#9fb0cd}
  .track{height:3px;background:var(--surface-2);display:flex;gap:2px;margin:0 -20px}
  .track i{flex:1 1 0;background:var(--surface-2);display:block}
  .track i.on{background:var(--salmon)}
  .track i.cur{background:var(--navy)}

  /* ---------- stage ---------- */
  .stage{flex:1;overflow:auto;padding:20px;display:grid;align-content:safe center}
  .card{max-width:740px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
  .kicker{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--salmon-ink)}
  .card h2{font-family:var(--display);font-size:clamp(21px,3.4vw,27px);color:var(--navy);line-height:1.18}
  .card h3{font-family:var(--display);font-size:clamp(20px,3.2vw,26px);color:var(--navy)}
  .lede{font-size:15px;color:var(--ink-2)}
  .gloss{font-size:14.5px;color:var(--ink-2)}
  .src{background:var(--surface);border-left:3px solid var(--salmon);border-radius:0 9px 9px 0;padding:11px 13px;font-size:15px;line-height:1.7}
  .src .k{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
  .src u{text-decoration:none;border-bottom:1.5px solid var(--line-strong);padding:0 1.6em}
  .rule{border-left:3px solid var(--salmon);background:var(--salmon-soft);padding:11px 13px;border-radius:0 9px 9px 0;font-size:14px}
  .rule b{color:var(--salmon-ink)}
  .rule .ex{display:block;margin-top:5px;font-family:var(--mono);font-size:12.5px;color:var(--ink)}
  .yes{color:var(--good);font-weight:600}
  .no{color:var(--bad);font-weight:600}
  .tag{font-family:var(--mono);font-size:11.5px;background:var(--surface-2);border-radius:5px;padding:1px 6px;color:var(--navy)}
  .hint{font-size:12.5px;color:var(--ink-3)}
  .trap{font-size:12.5px;color:var(--salmon-ink);font-weight:500}

  .opts{display:flex;flex-direction:column;gap:8px}
  .opt{display:flex;gap:11px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:11px 13px;cursor:pointer;font-size:15.5px}
  .opt:hover{border-color:var(--salmon)}
  .opt .num{flex:none;font-family:var(--mono);font-size:11px;color:var(--ink-3);border:1px solid var(--line);border-radius:5px;width:21px;height:21px;display:grid;place-items:center}
  .opt.ok{border-color:var(--good);background:var(--good-soft)}
  .opt.no{border-color:var(--bad);background:var(--bad-soft)}

  .cue{border:1px solid var(--line);border-radius:9px;padding:11px 13px;font-size:16px;background:var(--surface)}
  .cue .mono{font-family:var(--mono);font-size:15px;color:var(--navy)}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .row input[type="text"]{flex:1 1 280px;min-width:0;border:1px solid var(--line-strong);border-radius:8px;padding:10px 12px;background:var(--surface)}
  .row input[type="text"]:focus{outline:2px solid var(--salmon);outline-offset:1px;background:var(--paper)}
  textarea{width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:10px 12px;background:var(--surface);resize:vertical;min-height:70px}
  textarea:focus{outline:2px solid var(--salmon);outline-offset:1px;background:var(--paper)}
  .btn{border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:8px;padding:9px 15px;font-size:14px;font-weight:500;cursor:pointer}
  .btn:hover{background:#00296a}
  .btn.quiet{background:var(--paper);color:var(--ink-2);border-color:var(--line-strong)}
  .btn.quiet:hover{background:var(--surface-2);color:var(--navy)}
  .btn.accent{background:var(--salmon);border-color:var(--salmon)}
  .btn.accent:hover{background:#c96745}
  .btn:disabled{opacity:.45;cursor:default}
  .verdict{font-size:14px;display:none;gap:8px;flex-wrap:wrap;align-items:baseline}
  .verdict.show{display:flex}
  .verdict .mark{font-family:var(--mono);font-weight:700}
  .verdict.is-ok .mark{color:var(--good)}
  .verdict.is-no .mark{color:var(--bad)}
  .verdict .model{font-family:var(--mono);font-size:13.5px;color:var(--navy)}

  .who{display:flex;gap:10px;align-items:flex-start}
  .who-badge{flex:none;width:23px;height:23px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:11.5px;font-weight:700;margin-top:1px}
  .who-badge.a{background:var(--salmon-soft);color:var(--salmon-ink)}
  .who-badge.b{background:#e6ecf5;color:var(--navy)}
  .pol{font-family:var(--mono);font-size:12px;color:var(--navy);background:var(--surface-2);border-radius:5px;padding:1px 6px;margin-right:6px}
  .blurred{width:100%;text-align:left;border:1px solid var(--line-strong);border-radius:9px;padding:12px 14px;background:var(--surface);font-size:16px;cursor:pointer;filter:blur(6px);user-select:none;transition:filter .18s ease}
  .blurred.show{filter:none;user-select:text;cursor:default;background:var(--good-soft);border-color:var(--good);color:var(--navy)}

  .pool{display:flex;flex-wrap:wrap;gap:6px;padding:10px;border:1px dashed var(--line-strong);border-radius:9px}
  .word{border:1px solid var(--line-strong);background:var(--paper);border-radius:999px;padding:5px 11px;font-size:13.5px;cursor:pointer}
  .word[aria-pressed="true"]{border-color:var(--salmon);background:var(--salmon-soft);color:var(--salmon-ink);font-weight:600}
  .word.ok{border-color:var(--good);background:var(--good-soft);color:var(--good)}
  .word.no{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
  .buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}
  .bucket{border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:10px}
  .bucket h4{font-family:var(--mono);font-size:13.5px;color:var(--navy)}
  .bucket .sub{font-size:11px;color:var(--ink-3);margin-top:2px;min-height:28px}
  .bucket .slot{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;min-height:30px}

  .checkline{display:flex;gap:9px;align-items:flex-start;font-size:15px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;cursor:pointer}
  .checkline.done{border-color:var(--good);background:var(--good-soft)}
  .checkline input{margin-top:4px;accent-color:var(--good);width:16px;height:16px;flex:none}

  .audio-card{border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:9px}
  .audio-card audio{width:100%}
  .urlrow{display:flex;gap:8px;flex-wrap:wrap}
  .urlrow input{flex:1 1 240px;min-width:0;border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;background:var(--paper)}
  .model-ans{display:none;font-size:14px;color:var(--navy);background:var(--surface-2);border-radius:8px;padding:10px 12px}
  .model-ans.show{display:block}

  .scrollbox{max-height:min(46vh,340px);overflow:auto;border:1px solid var(--line);border-radius:9px;padding:12px;background:var(--surface)}
  .line{display:grid;grid-template-columns:54px 1fr;gap:9px;font-size:14.5px;margin-bottom:6px}
  .line .w{font-family:var(--mono);font-size:12px;color:var(--salmon-ink);font-weight:600}
  table.vocab{border-collapse:collapse;width:100%;font-size:13.5px}
  table.vocab th{background:var(--navy);color:#fff;text-align:left;padding:7px 10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;position:sticky;top:0}
  table.vocab td{border-top:1px solid var(--line);padding:7px 10px;vertical-align:top;background:var(--paper)}
  table.vocab tr.band td{background:var(--surface-2);font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--navy)}
  table.vocab .term{font-weight:600;color:var(--navy)}
  table.vocab .vi{color:var(--ink-2);font-size:13px}
  table.vocab .ipa{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);white-space:nowrap}

  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:8px}
  .tile{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--surface)}
  .tile .k{font-size:11.5px;color:var(--ink-3)}
  .tile .v{font-family:var(--mono);font-size:16px;font-weight:600;color:var(--navy);font-variant-numeric:tabular-nums}
  .tile.done{border-color:var(--good)}
  .tile.done .v{color:var(--good)}
  .export{width:100%;min-height:76px;border:1px solid var(--line-strong);border-radius:8px;padding:10px;font-family:var(--mono);font-size:12px;background:var(--paper)}

  .coach{border:1px dashed var(--line-strong);border-radius:9px;background:var(--surface);padding:11px 13px;font-size:13.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:7px}
  .coach .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--navy);font-weight:600}
  body[data-mode="self"] .coach{display:none}

  /* ---------- footer ---------- */
  .nav{flex:none;border-top:1px solid var(--line);padding:11px 20px;display:flex;align-items:center;gap:9px;background:var(--paper)}
  .nav .keys{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
  @media (max-width:560px){
    .nav .keys{display:none}
    .stage{padding:16px}
    .bar{padding-inline:16px}
    .nav{padding-inline:16px}
    .line{grid-template-columns:1fr;gap:1px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="app">
  <header class="bar">
    <div class="bar-top">
      <span class="eyebrow">English2impact · <b>English Reflex 2</b> · S01</span>
      <span class="bar-title">Finished Past</span>
      <span class="bar-right">
        <span class="mini" id="overall">0%</span>
        <span class="seg" role="group" aria-label="Mode">
          <button type="button" id="mode-self" aria-pressed="true">Self-study</button>
          <button type="button" id="mode-coach" aria-pressed="false">Coaching</button>
        </span>
        <button type="button" class="ghost" id="btn-terms">Terms</button>
        <button type="button" class="ghost" id="btn-reset">Reset</button>
      </span>
    </div>
    <nav class="steps" id="steps" aria-label="Lesson steps"></nav>
    <div class="track" id="track"></div>
  </header>

  <div class="stage" id="stage"><div class="card" id="card"></div></div>

  <footer class="nav">
    <button type="button" class="btn quiet" id="prev">Back</button>
    <button type="button" class="btn" id="next">Next</button>
    <span class="mini" id="pos"></span>
    <span class="keys" id="keys"></span>
  </footer>
</div>
<script>
(function(){
"use strict";
const VOCAB = [
  ["daily","get around to","sắp xếp được thời gian để làm","/ˌɡet əˈraʊnd tə/","[−] I did not <b>get around to</b> the supplier list until Friday."],
  ["daily","end up (doing)","rốt cuộc lại (làm gì)","/ˌend ˈʌp/","[+] We <b>ended up</b> writing the script ourselves."],
  ["daily","run into","tình cờ gặp; gặp phải (vấn đề)","/ˌrʌn ˈɪntə/","[Y/N ?] Did you <b>run into</b> any problems during the migration?"],
  ["daily","sort out","giải quyết, xử lý ổn thỏa","/ˌsɔːt ˈaʊt/","[+] The team <b>sorted</b> the old data <b>out</b> manually."],
  ["daily","the other day","hôm nọ, mấy hôm trước","/ði ˌʌðə ˈdeɪ/","[Wh- ?] Who did you meet <b>the other day</b>?"],
  ["work","roll out","triển khai (hệ thống, sản phẩm)","/ˌrəʊl ˈaʊt/","[+] We <b>rolled out</b> the new system last quarter."],
  ["work","sign off on","duyệt, phê duyệt chính thức","/ˌsaɪn ˈɒf ɒn/","[Y/N ?] Did the board <b>sign off on</b> the extra budget?"],
  ["work","kick off","khởi động, bắt đầu (dự án)","/ˌkɪk ˈɒf/","[+] We <b>kicked off</b> in early January."],
  ["work","wrap up","hoàn tất, kết thúc","/ˌræp ˈʌp/","[−] We did not <b>wrap up</b> the project before March."],
  ["work","come in under budget","hoàn thành dưới mức ngân sách","/ˌkʌm ɪn ˌʌndə ˈbʌdʒɪt/","[+] The team <b>came in under budget</b> for the first time."]
];

/* term lab — vi prompt, english gloss, line from the dialogue, three options */
const TERMS = [
  {vi:"triển khai (hệ thống, sản phẩm)", en:"put a new system into use across the company",
   line:"So — we <u></u> the new system last quarter. How did it actually go?",
   opts:["signed off on","rolled out","wrapped up"], a:1, term:"roll out"},
  {vi:"khởi động, bắt đầu (dự án)", en:"start a project",
   line:"We <u></u> in early January and finished three weeks later.",
   opts:["kicked off","came in under budget","got around to it"], a:0, term:"kick off"},
  {vi:"duyệt, phê duyệt chính thức", en:"formally approve something",
   line:"Did the board <u></u> the extra budget in the end?",
   opts:["get around to","come in under","sign off on"], a:2, term:"sign off on"},
  {vi:"hoàn thành dưới mức ngân sách", en:"spend less than the money set aside",
   line:"They did, and we still <u></u> — which nobody saw coming.",
   opts:["came in under budget","sorted it out","ran into it"], a:0, term:"come in under budget"},
  {vi:"gặp phải (vấn đề); tình cờ gặp (ai đó)", en:"meet a problem — or a person — by accident",
   line:"Did you <u></u> any problems during the migration?",
   opts:["wrap up","run into","sort out"], a:1, term:"run into"},
  {vi:"giải quyết, xử lý ổn thỏa", en:"fix a problem and finish with it",
   line:"The old data did not transfer cleanly, so we <u></u> by hand.",
   opts:["kicked it off","ran into it","sorted it out"], a:2, term:"sort out"},
  {vi:"rốt cuộc lại (làm gì)", en:"finish by doing something you did not plan",
   line:"Not all of it. We <u></u> writing a script, and that saved us ten days.",
   opts:["ended up","got around to","signed off on"], a:0, term:"end up (doing)"},
  {vi:"sắp xếp được thời gian để làm", en:"finally find the time to do it",
   line:"I know. I just never <u></u> it — the whole thing moved too fast.",
   opts:["ran into","got around to","wrapped up"], a:1, term:"get around to"},
  {vi:"hôm nọ, mấy hôm trước", en:"a few days ago — finished time",
   line:"I ran into Peter <u></u>, and he told me the rollout failed.",
   opts:["by then","last quarter","the other day"], a:2, term:"the other day"},
  {vi:"hoàn tất, kết thúc", en:"finish a piece of work",
   line:"We <u></u> on the last Friday of March, two days before the deadline.",
   opts:["ran into","wrapped up","ended up"], a:1, term:"wrap up"}
];

const SORT_WORDS = [
  {w:"kick",  past:"kicked",       b:"t"},
  {w:"wrap",  past:"wrapped",      b:"t"},
  {w:"finish",past:"finished",     b:"t"},
  {w:"ask",   past:"asked",        b:"t"},
  {w:"roll",  past:"rolled",       b:"d"},
  {w:"sign",  past:"signed",       b:"d"},
  {w:"transfer",past:"transferred",b:"d"},
  {w:"sort",  past:"sorted",       b:"id"},
  {w:"end",   past:"ended",        b:"id"},
  {w:"need",  past:"needed",       b:"id"},
  {w:"run",   past:"ran",          b:"irr"},
  {w:"come",  past:"came",         b:"irr"},
  {w:"get",   past:"got",          b:"irr"}
];
const SORT_BUCKETS = [
  {id:"t",  name:"/t/",  sub:"after a voiceless sound — k, p, s, f, ʃ, tʃ"},
  {id:"d",  name:"/d/",  sub:"after a voiced sound — l, n, g, v, z, r, vowels"},
  {id:"id", name:"/ɪd/", sub:"after t or d only — and only there"},
  {id:"irr",name:"irregular", sub:"no ending at all — nothing to drop"}
];

const DIALOGUE = [
  ["Clara","So — we rolled out the new system last quarter. How did it actually go?"],
  ["Adam","Better than I expected. We kicked off in early January and wrapped it up three weeks later."],
  ["Clara","Did the board sign off on the extra budget in the end?"],
  ["Adam","They did, and we still came in under budget — which nobody saw coming."],
  ["Clara","Did you run into any problems during the migration?"],
  ["Adam","We ran into one big one. The old data did not transfer cleanly, so we sorted it out by hand."],
  ["Clara","You sorted all of it out manually? That sounds like weeks of work."],
  ["Adam","Not all of it. We ended up writing a script, and that saved us about ten days."],
  ["Clara","Why did you not tell me? I had two spare people on my team in February."],
  ["Adam","I know. I just never got around to it — the whole thing moved too fast."],
  ["Clara","I ran into Peter the other day, and he told me the rollout failed."],
  ["Adam","Peter is behind. He left the project in February, so he did not see the second phase."],
  ["Clara","When exactly did you finish?"],
  ["Adam","We wrapped up on the last Friday of March, two days before the deadline."],
  ["Clara","And the client? Did they sign it off?"],
  ["Adam","They signed off on it the same week. We did not hear a single complaint after that."]
];

const COMPREHENSION = [
  ["When did the team kick off the project?","In early January."],
  ["How long did the rollout take?","About three weeks."],

function norm(s){
  return (s||"").toLowerCase()
    .replace(/[‘’ʼ]/g,"'").replace(/[–—]/g,"-")
    .replace(/n't\b/g," not").replace(/[.,!?;:"“”]/g,"")
    .replace(/\s+/g," ").trim();
}
function matches(v,acc){const n=norm(v);return acc.some(function(a){return norm(a)===n;});}

/* ======================= chrome ======================= */

function paintChrome(){
  const cur=SCREENS[pos];
  document.getElementById("steps").innerHTML = STEPMETA.map(function(st,n){
    const d=stepDone(n), t=st.keys.length;
    return '<button type="button" data-step="'+n+'"'+(n===cur.s?' aria-current="true"':'')+(d===t?' class="done"':'')+
      '><span class="n">'+(n+1)+'</span>'+st.name+'<span class="c">'+d+'/'+t+'</span></button>';
  }).join("");
  const inStep=SCREENS.filter(function(x){return x.s===cur.s;});
  document.getElementById("track").innerHTML=inStep.map(function(x){
    const k=screenKey(x), me=(x===cur);
    return '<i class="'+(k&&isDone(k)?"on":"")+(me?" cur":"")+'"></i>';
  }).join("");
  let sum=0, full=0;
  STEPMETA.forEach(function(st,n){const d=stepDone(n),t=st.keys.length; sum+=t?d/t:0; if(t&&d===t) full++;});
  document.getElementById("overall").textContent=Math.round(sum/STEPMETA.length*100)+"%";
  document.getElementById("pos").textContent=STEPMETA[cur.s].name+" · "+(inStep.indexOf(cur)+1)+" of "+inStep.length;
  document.getElementById("prev").disabled = pos===0;
  document.getElementById("next").disabled = pos===SCREENS.length-1;
}

}

/* --- warm-up sort --- */
function rSort(){
  card.innerHTML=
    '<span class="kicker">Step 1 · Warm-up</span>'+
    '<h2>The ending you cannot hear</h2>'+
    '<p class="lede">Vietnamese does not close a syllable with a consonant cluster, so <i>rolled</i>, <i>signed</i>, <i>kicked</i> and <i>wrapped</i> lose their endings — and the tense goes with them.</p>'+
    '<div class="rule"><b>/ɪd/ only after t and d.</b><span class="ex"><span class="yes">✓</span> sorted /ˈsɔːtɪd/ &nbsp;·&nbsp; <span class="no">✗</span> rolled is not /ˈrəʊlɪd/ &nbsp;·&nbsp; <span class="no">✗</span> signed is not /ˈsaɪnɪd/</span></div>'+
    '<p class="hint">Tap a verb, then tap the column it belongs in. Tap a placed verb to send it back.</p>'+
    '<div class="pool" id="pool">'+SORT_WORDS.map(function(w){return '<button type="button" class="word" data-word="'+w.w+'">'+w.w+'</button>';}).join("")+'</div>'+
    '<div class="buckets" id="buckets">'+SORT_BUCKETS.map(function(b){
      return '<div class="bucket" data-bucket="'+b.id+'"><h4>'+b.name+'</h4><div class="sub">'+b.sub+'</div><div class="slot"></div></div>';
    }).join("")+'</div>'+
    '<div class="row"><button type="button" class="btn" id="sort-check">Check the sort</button>'+
    '<button type="button" class="btn quiet" id="sort-show">Show answers</button>'+
    '<span class="hint" id="sort-tally"></span></div>'+
    coach("Run it as a board race: three columns plus a fourth for the irregulars. The payoff line — <b>the ending is easiest when the next word starts with a vowel</b>, and particles usually do: <span class='tag'>rolled_out</span> <span class='tag'>sorted_it_out</span> <span class='tag'>ended_up</span>.");

  let picked=null;
  const pool=document.getElementById("pool");
  function place(w,b){
    const btn=card.querySelector('.word[data-word="'+w+'"]');
    const slot=card.querySelector('.bucket[data-bucket="'+b+'"] .slot');
    if(!btn||!slot) return;
    slot.appendChild(btn); btn.setAttribute("aria-pressed","false");
    S.text["sort-"+w]=b; save();
  }
  pool.addEventListener("click",function(e){
    const w=e.target.closest(".word"); if(!w) return;
    card.querySelectorAll(".word").forEach(function(x){x.setAttribute("aria-pressed","false");});
    picked=w.getAttribute("data-word"); w.setAttribute("aria-pressed","true");
  });
  document.getElementById("buckets").addEventListener("click",function(e){
    const wb=e.target.closest(".word");
    if(wb){ const w=wb.getAttribute("data-word"); pool.appendChild(wb); wb.className="word"; wb.textContent=w;
      delete S.text["sort-"+w]; mark("sort-"+w,false); return; }
    const b=e.target.closest(".bucket");
    if(b&&picked){ place(picked,b.getAttribute("data-bucket")); picked=null; }
  });
  function check(reveal){
    let ok=0;
    SORT_WORDS.forEach(function(x){
      const btn=card.querySelector('.word[data-word="'+x.w+'"]');
      if(reveal && S.text["sort-"+x.w]!==x.b) place(x.w,x.b);
      const now=S.text["sort-"+x.w], good=(now===x.b);
      btn.classList.toggle("ok",good&&!!now); btn.classList.toggle("no",!!now&&!good);
      btn.textContent = now ? x.w+" → "+x.past : x.w;
      mark("sort-"+x.w,good&&!!now); if(good&&now) ok++;
    });
    document.getElementById("sort-tally").textContent=ok+" / "+SORT_WORDS.length+" placed correctly";
  }
  document.getElementById("sort-check").onclick=function(){check(false);};
  document.getElementById("sort-show").onclick=function(){check(true);};
  SORT_WORDS.forEach(function(x){const b=S.text["sort-"+x.w]; if(b) place(x.w,b);});
  if(SORT_WORDS.some(function(x){return isDone("sort-"+x.w);})) check(false);
}

    }).join("")+'</div>'+
    '<p class="hint">Guess it before you look for it. Press 1, 2 or 3 — then Enter for the next term.</p>';
  const done=isDone("t-"+sc.i);
  if(done) lock(t.a,null);
  card.querySelector("#opts").addEventListener("click",function(e){
    const b=e.target.closest(".opt"); if(!b||b.disabled) return;
    answer(+b.getAttribute("data-opt"));

  function answer(n){ mark("t-"+sc.i, n===t.a); lock(t.a,n); }

    card.querySelectorAll(".opt").forEach(function(b){

      if(k===right) b.classList.add("ok"); else if(k===chosen) b.classList.add("no");

}

/* --- typed drill --- */
function rType(sc){
  const bank=BANKS[sc.k], it=bank[sc.i], key=sc.k+"-"+sc.i;
  const label={a:"[+] → [−]",b:"[Y/N ?]",c:"[Wh- ?]"}[sc.k];
  const stepName={a:"Drill A",b:"Drill B",c:"Drill C"}[sc.k];
  card.innerHTML=
    '<span class="kicker">'+stepName+' · '+label+' · '+(sc.i+1)+' of '+bank.length+'</span>'+
    '<div class="cue">'+(sc.k==="b"?'<span class="mono">'+it.cue+'</span>':it.cue)+
      (it.start?' <span class="tag">start with '+it.start+'</span>':'')+'</div>'+
    '<div class="row"><input type="text" id="ans" placeholder="Your answer…" autocomplete="off" spellcheck="false">'+
    '<button type="button" class="btn" id="check">Check</button>'+
    '<button type="button" class="btn quiet" id="show">Answer</button></div>'+
    '<div class="verdict" id="verdict"><span class="mark"></span><span class="model"></span></div>'+
    (it.trap?'<div class="trap">'+it.trap+'</div>':'');
  const inp=document.getElementById("ans");
  if(S.text[key]!==undefined) inp.value=S.text[key];
  inp.addEventListener("input",function(){S.text[key]=inp.value;save();});
  function check(reveal){
    if(reveal){ inp.value=it.acc[0]; S.text[key]=inp.value; save(); }
    const good=matches(inp.value,it.acc)&&inp.value.trim()!=="";
    const v=document.getElementById("verdict");
    v.classList.add("show");
    v.querySelector(".mark").textContent=good?"✓ correct":"✗ not yet";
    v.classList.toggle("is-ok",good); v.classList.toggle("is-no",!good);
    v.querySelector(".model").innerHTML=(good&&!reveal)?"":it.acc[0];
    mark(key,good);
  }
  document.getElementById("check").onclick=function(){check(false);};
  document.getElementById("show").onclick=function(){check(true);};
  if(isDone(key)) check(false);
  setTimeout(function(){inp.focus({preventScroll:true});},0);
  card.onEnter=function(){ if(document.getElementById("verdict").classList.contains("show")) go(pos+1); else check(false); };
}

/* --- spoken block intro --- */
function rSayHead(sc){
  const isA=(sc.k==="ax");
  card.innerHTML=
    '<span class="kicker">'+(isA?"Drill A":"Drill B")+' · speaking</span>'+
    '<h2>'+(isA?"Let's reflex with these exchanges!":"Let's tackle these conversations!")+'</h2>'+
    '<p class="lede"><b>Nothing to type.</b> '+(isA
      ? 'A states it. You are B: say the same sentence back in the negative, out loud, at speed. Then reveal and check yourself.'
      : 'A asks from the cue words. You are B: answer out loud with the short form only — <i>Yes, S + did</i> / <i>No, S + didn\'t</i>. Then reveal and check yourself.')+'</p>'+
    '<div class="src"><span class="k">Worked example</span>'+
      (isA
        ? who("a","[+]","We rolled out the new system last quarter.")+who("b","[−]","Really? We <b>didn't roll out</b> the new system last quarter.")
        : who("a","[?+]","you / roll out / the system / last quarter")+who("b","[+]","<b>Yes, we did.</b>"))+
    '</div>'+
    '<p class="hint">'+(isA
      ? 'The ending has to be audible — <i>didn\'t roll out</i>, <i>didn\'t sign off on</i> — and a pronoun stays in the middle: <i>didn\'t wrap <b>it</b> up</i>.'
      : 'Three of the ten are negative questions. Answer the <b>fact</b>, not the shape of the question.')+'</p>';
}

/* --- spoken item --- */
function rSay(sc){
  const bank=SAY[sc.k], it=bank[sc.i], key=sc.k+"-"+sc.i;
  const isA=(sc.k==="ax");
  const cue = isA ? who("a","[+]",it.a)
                  : who("a", it.a.slice(0,it.a.indexOf("]")+1), '<span class="mono">'+it.a.slice(it.a.indexOf("]")+2)+'</span>');
  card.innerHTML=
    '<span class="kicker">'+(isA?"Drill A":"Drill B")+' · speaking · '+(sc.i+1)+' of '+bank.length+'</span>'+
    '<div class="cue">'+cue+'</div>'+
    '<p class="hint">Say B out loud, at speed. Then reveal.</p>'+
    '<div class="who"><span class="who-badge b">B</span><span class="pol">'+(it.want==="+"?"[+]":"[−]")+'</span></div>'+
    '<button type="button" class="blurred" id="blur">'+it.b+'</button>'+
    '<div class="row"><button type="button" class="btn" id="rev">Reveal</button>'+
    '<button type="button" class="btn quiet" id="said" hidden>I said it</button>'+
    '<button type="button" class="btn quiet" id="again" hidden>Again</button></div>';
  const bl=document.getElementById("blur"), rv=document.getElementById("rev"),
        sd=document.getElementById("said"), ag=document.getElementById("again");
  function reveal(on){ bl.classList.toggle("show",on); rv.hidden=on; sd.hidden=!on; ag.hidden=!on; }
  bl.onclick=function(){reveal(true);};
  rv.onclick=function(){reveal(true);};
  sd.onclick=function(){mark(key,true); go(pos+1);};
  ag.onclick=function(){mark(key,false); reveal(false);};
  if(isDone(key)) reveal(true);
  card.onEnter=function(){ if(rv.hidden){ mark(key,true); go(pos+1); } else reveal(true); };
}

/* --- audio --- */
function rAudio(){
  card.innerHTML=
    '<span class="kicker">Step 6 · Dialogue decode</span>'+
    '<h2>Listen at full speed</h2>'+
    '<p class="lede"><b>Before you listen:</b> Clara missed last quarter and has heard the rollout went badly. Every answer Adam gives is a finished event with a finished time attached.</p>'+
    '<div class="audio-card">'+
      '<div class="urlrow"><input type="url" id="aurl" placeholder="Paste the MP3 link…"><button type="button" class="btn" id="aset">Load</button></div>'+
      '<audio id="aud" controls preload="none"></audio>'+
      '<div class="row"><span class="hint">Speed</span>'+
      '<button type="button" class="btn quiet" data-rate="1">1.00 — the lesson</button>'+
      '<button type="button" class="btn quiet" data-rate="0.85">0.85 — shadowing</button></div>'+
    '</div>'+
    '<p class="hint">Listen once, books closed, then press Next and answer the eight questions.</p>'+
    coach("Stop at line 6: <i>The old data did not transfer cleanly, so we sorted it out by hand.</i> The whole grammar of the session in one breath. Rebuild it orally before moving on.");
  const a=document.getElementById("aud"), u=document.getElementById("aurl");
  if(S.audio){u.value=S.audio;a.src=S.audio;}
  document.getElementById("aset").onclick=function(){S.audio=u.value.trim();save();a.src=S.audio;a.load();};
  card.querySelectorAll("[data-rate]").forEach(function(b){
    b.onclick=function(){a.playbackRate=parseFloat(b.getAttribute("data-rate"));};
  });
}

/* --- comprehension --- */
function rQ(sc){
  const q=COMPREHENSION[sc.i], key="q-"+sc.i;
  card.innerHTML=
    '<span class="kicker">Step 6 · question '+(sc.i+1)+' of '+COMPREHENSION.length+'</span>'+
    '<h3 style="font-size:20px">'+q[0]+'</h3>'+
    '<textarea id="qa" placeholder="Your answer…"></textarea>'+
    '<div class="row"><button type="button" class="btn quiet" id="showm">Show model answer</button>'+
    '<button type="button" class="btn" id="hadit">I had this</button>'+
    '<button type="button" class="btn quiet" id="review">Review again</button></div>'+
    '<div class="model-ans" id="model">'+q[1]+'</div>';
  const ta=document.getElementById("qa");
  if(S.text[key]!==undefined) ta.value=S.text[key];
  ta.addEventListener("input",function(){S.text[key]=ta.value;save();});
  const m=document.getElementById("model");
  document.getElementById("showm").onclick=function(){m.classList.add("show");};
  document.getElementById("hadit").onclick=function(){m.classList.add("show");mark(key,true);go(pos+1);};
  document.getElementById("review").onclick=function(){mark(key,false);};
  if(isDone(key)) m.classList.add("show");
}

/* --- transcript --- */
function rScript(){
  card.innerHTML=
    '<span class="kicker">Step 6 · transcript</span>'+
    '<h2>Adam and Clara, in full</h2>'+
    '<p class="hint">Read it only after you have answered all eight.</p>'+
    '<div class="scrollbox">'+DIALOGUE.map(function(L){
      return '<div class="line"><span class="w">'+L[0]+'</span><span>'+L[1]+'</span></div>';
    }).join("")+'</div>'+
    coach("Line 2 vs line 14: <i>wrapped <b>it</b> up</i> / <i>wrapped up</i> — same chunk, split once and whole once. Lines 15 and 16: <i>sign <b>it</b> off</i> / <i>signed <b>off on</b> it</i>. Play both back to back; drill both, explain neither.");
}

/* --- exit ticket --- */
function rExit(){
  card.innerHTML=
    '<span class="kicker">Step 7 · Exit ticket</span>'+
    '<h2>Before you leave</h2>'+
    '<p class="lede">One term of your own, one pronoun object so the placement is audible, a finished time reference in every sentence.</p>'+
    EXIT.map(function(t,i){
      return '<label class="checkline'+(isDone("x-"+i)?" done":"")+'"><input type="checkbox" data-x="'+i+'"'+(isDone("x-"+i)?" checked":"")+'><span>'+t+'</span></label>';
    }).join("")+
    '<div class="rule"><b>The chain.</b><span class="ex">[+] We rolled it out last quarter. → [−] We didn\'t roll it out last quarter. → [Y/N ?] Did you roll it out last quarter? → [Wh- ?] When did you roll it out?</span></div>';
  card.querySelectorAll("[data-x]").forEach(function(cb){
    cb.onchange=function(){
      mark("x-"+cb.getAttribute("data-x"),cb.checked);
      cb.closest(".checkline").classList.toggle("done",cb.checked);
    };
  });
}

/* --- report --- */
function rReport(){
  let sum=0, full=0;
  STEPMETA.forEach(function(st,n){const d=stepDone(n),t=st.keys.length;sum+=t?d/t:0;if(t&&d===t)full++;});
  const pct=Math.round(sum/STEPMETA.length*100);
  card.innerHTML=
    '<span class="kicker">Session report</span>'+
    '<h2>'+pct+'% complete — '+full+' of '+STEPMETA.length+' steps</h2>'+
    '<div class="tiles">'+STEPMETA.map(function(st,n){
      const d=stepDone(n),t=st.keys.length;
      return '<div class="tile'+(t&&d===t?" done":"")+'"><div class="k">'+(n+1)+' · '+st.name+'</div><div class="v">'+d+'/'+t+'</div></div>';
    }).join("")+'</div>'+
    '<textarea class="export" id="exp" readonly></textarea>'+
    '<div class="row"><button type="button" class="btn accent" id="copy">Copy summary</button>'+
    '<span class="hint" id="cnote"></span></div>';
  const box=document.getElementById("exp");
  box.value='English Reflex 2 — S01 "We rolled out the new system last quarter."\nOverall: '+pct+'%  ('+full+'/'+STEPMETA.length+' steps)\n'+
    STEPMETA.map(function(st,n){return "  "+(n+1)+". "+st.name+": "+stepDone(n)+"/"+st.keys.length;}).join("\n");
  document.getElementById("copy").onclick=function(){
    box.select(); try{navigator.clipboard.writeText(box.value);}catch(e){}
    document.getElementById("cnote").textContent="Copied.";
  };
}

/* --- terms panel --- */
function renderTerms(){
  let rows="";
  ["daily","work"].forEach(function(band){
    rows+='<tr class="band"><td colspan="3">'+(band==="daily"?"Daily — 5 terms":"Workplace — 5 terms")+'</td></tr>';
    VOCAB.filter(function(v){return v[0]===band;}).forEach(function(v){
      rows+='<tr><td><div class="term">'+v[1]+'</div><div class="vi">'+v[2]+'</div></td><td class="ipa">'+v[3]+'</td><td>'+v[4]+'</td></tr>';
    });
  });
  card.innerHTML=
    '<span class="kicker">Reference</span><h2>The ten terms</h2>'+
    '<div class="scrollbox" style="padding:0"><table class="vocab"><thead><tr><th>Term — nghĩa</th><th>IPA</th><th>In the four forms</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<div class="rule"><b>A pronoun object goes INSIDE a separable term.</b><span class="ex"><span class="yes">✓</span> We rolled <b>it</b> out. &nbsp; <span class="no">✗</span> We rolled out it.<br><span class="yes">✓</span> I ran into <b>him</b>. &nbsp; <span class="no">✗</span> I ran him into.<br>Splits: roll out · sort out · wrap up · kick off &nbsp;|&nbsp; Never splits: run into · get around to · come in under · sign off on</span></div>'+
    '<div class="row"><button type="button" class="btn quiet" id="copyv">Copy as plain text</button>'+
    '<button type="button" class="btn" id="backl">Back to the lesson</button></div>';
  document.getElementById("backl").onclick=function(){render();};
  document.getElementById("copyv").onclick=function(){
    const txt="Term\tNghĩa\tIPA\tExample\n"+VOCAB.map(function(v){
      return v[1]+"\t"+v[2]+"\t"+v[3]+"\t"+v[4].replace(/<[^>]+>/g,"");
    }).join("\n");
    try{navigator.clipboard.writeText(txt);}catch(e){}
    this.textContent="Copied — paste anywhere";
  };
}

/* ======================= keyboard ======================= */
document.addEventListener("keydown",function(e){
  const typing = /input|textarea/i.test((document.activeElement||{}).tagName||"");
  if(e.key==="Enter"){
    if(typeof card.onEnter==="function"){ e.preventDefault(); card.onEnter(); return; }
    if(!typing){ e.preventDefault(); go(pos+1); return; }
  }
  if(typing) return;
  if((e.key==="1"||e.key==="2"||e.key==="3") && typeof card.onkeydownProxy==="function"){ card.onkeydownProxy(+e.key-1); return; }
  if(e.key==="ArrowRight") go(pos+1);
  if(e.key==="ArrowLeft") go(pos-1);
});

/* ======================= boot ======================= */
document.getElementById("keys").textContent="Enter · ← → to move";
setMode(S.mode||"self");
render();

})();
</script>
